name: Build Psychology Short Video

on:
  repository_dispatch:
    types: [generate_video]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Python libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts moviepy==1.0.3 Pillow==9.5.0 requests

      - name: Run Video Generator
        run: python main.py
